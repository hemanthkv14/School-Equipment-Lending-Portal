<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Auth Client</title>
</head>
<body>
<h1>Auth Client</h1>

<h2>Register</h2>
<input id="regName" placeholder="name" />
<input id="regPass" placeholder="password" type="password" />
<input id="regroleid" placeholder="roleid" />
<button onclick="register()">Register</button>
<pre id="regOut"></pre>

<h2>Login</h2>
<input id="loginEmail" placeholder="username" />
<input id="loginPass" placeholder="password" type="password" />
<button onclick="login()">Login</button>
<pre id="loginOut"></pre>

<script>
    const API_BASE = 'http://localhost:8080'; // gateway will proxy /api/auth -> auth-service

    async function register() {
        const role_id = document.getElementById('regroleid').value;
        const username = document.getElementById('regName').value;
        const password = document.getElementById('regPass').value;
        const res = await fetch(API_BASE + '/api/auth/register', {
            method:'POST', headers:{'content-type':'application/json'},
            body: JSON.stringify({username, password, role_id})
        });
        document.getElementById('regOut').innerText = JSON.stringify(await res.json(), null, 2);
    }

    async function login() {
        const username = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        const res = await fetch(API_BASE +'/api/auth/login', {
            method:'POST', headers:{'content-type':'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        document.getElementById('loginOut').innerText = JSON.stringify(data, null, 2);
        if (data.token) localStorage.setItem('token', data.token);
    }

</script>
</body>
</html>
