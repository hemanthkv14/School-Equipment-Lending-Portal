# PostgreSQL configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
# Set to 'never' since Docker already initializes the database with schema.sql and data.sql
spring.sql.init.mode=never
# Keep 'none' since schema.sql handles creation
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: format SQL output nicely
spring.jpa.properties.hibernate.format_sql=true

# Set the base path for all REST endpoints
spring.mvc.servlet.path=/api

# Enable detailed error messages for debugging
server.error.include-message=always
server.error.include-stacktrace=always

# HikariCP connection pool settings
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# Jackson date format configuration
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false